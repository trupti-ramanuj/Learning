<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="document.write('ok submit')">find</button>
    <button onclick="console.log('+1')">add</button>
</body>
<button onclick="alert('sorry under maintange')">define</button>

<button ondblclick="document.write('find mywork')">time</button>

<button onmouseenter="document.write('find mywork')">key</button>

<button onmouseleave="document.write('reading')">device</button>

<button onkeypress="document.write('reading')">submit</button>

<button onclick="sayHello()">Click</button>

<div id="parent">
    <button id="child">Click</button>
</div>
<div id="list">
    <button>Click</button>
</div>
<script>
    //Event Bubbling
    parent.addEventListener("click", () => {
        console.log("Parent clicked");
    });

    child.addEventListener("click", () => {
        console.log("Child clicked");
    });
    // Event Delegation
    const list = document.querySelector("#list");

    list.addEventListener("click", event => {
        if (event.target.matches("button")) {
            console.log("Button clicked");
        }
    });
</script>

</html>
