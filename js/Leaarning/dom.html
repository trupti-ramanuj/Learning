<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .active {
            background: blue;
            color: white;
        }

        .mystyle {
            width: 100%;
            padding: 25px;
            background-color: coral;
            color: white;
            font-size: 25px;
            box-sizing: border-box;
        }

        .dark {
            background: black;
            color: white;
        }
    </style>
</head>

<body>
    <h1 id="title">Hello World</h1>
    <p>HTML</p>
    <p>CSS</p>
    <p>JavaScript</p>
    <div id="box"></div>
    <button onclick="myFunction()">Try it</button>

    <div id="myDIV">
        This is a DIV element.
    </div>
    <div id="parent">
        <p id="child">Hello</p>
    </div>
    <ul id="myList">
        <li>Coffee</li>
        <li>Tea</li>
    </ul>
    <p id="demo"></p>
    <p id="demo2"></p>

    <h1 id="one">One</h1>

    <p>Paragraph</p>

    <h1 id="heading">Hello</h1>

    <button id="btn">
        Change Text
    </button>

    <button id="mode">
        Dark Mode
    </button>

    <ul id="list">
    </ul>

    <button id="add">
        Add Item
    </button>
    <p id="msg">Hello Student</p>

    <button id="removeBtn">
        Remove
    </button>
    <script>
        var heading = document.getElementById("title");

        console.log(heading);

        var heading = document.getElementById("title");

        heading.textContent = "Welcome to JavaScript";

        var paragraphs = document.querySelectorAll("p");

        console.log(paragraphs);

        paragraphs.forEach(item => {
            console.log(item.textContent);
        });

        //innerHTML

        document.getElementById("box").innerHTML =
            "<h2>Hello</h2>";


        box.innerHTML =
            `
            <h1>JavaScript</h1>
             <p>DOM Manipulation</p>
            `;
        //textContent
        box.textContent =
            "<h1>Hello</h1>";


        box.innerHTML = "<b>Hello</b>";

        box.textContent = "<b>Hello</b>";

        //style in js

        var heading =
            document.getElementById("title");

        heading.style.color = "red";

        heading.style.background = "yellow";

        heading.style.fontSize = "40px";

        //add & remove , toggle css class
        box.classList.add("active");
        box.classList.remove("active");
        box.classList.toggle("active");

        function myFunction() {
            var element = document.getElementById("myDIV");
            element.classList.toggle("mystyle");
        }

        var heading =
            document.createElement("h1");

        title.textContent = "Hello";
        document.body.appendChild(heading);


        var p = document.createElement("p");

        p.textContent = "Learning DOM";

        document.body.appendChild(p);
        var heading = document.getElementById("title");

        heading.remove();

        var child = document.getElementById("child");

        console.log(child.parentNode);
        var parent =
            document.getElementById("parent");

        console.log(parent.children);

        console.log(parent.firstElementChild);
        console.log(parent.lastElementChild);
        var element = document.getElementById("myList")
        document.getElementById("demo").innerHTML = element.firstElementChild.innerHTML;
        var element = document.getElementById("myList")
        document.getElementById("demo2").innerHTML = element.lastElementChild.innerHTML;

        var one = document.getElementById("one");

        console.log(one.nextSibling);
        console.log(one.previousElementSibling);

        var btn = document.getElementById("btn");

        btn.addEventListener("click", () => {

            document.getElementById("heading").textContent =
                "Welcome to JavaScript";

        });
        let button =
            document.getElementById("mode");

        button.addEventListener("click", () => {

            document.body.classList.toggle("dark");

        });

        var btn = document.getElementById("add");

        btn.addEventListener("click", () => {

            var li = document.createElement("li");

            li.textContent = "New Item";

            document.getElementById("list").appendChild(li);

        });

        document.getElementById("removeBtn").addEventListener("click", () => {
            document.getElementById("msg").remove();
        });
    </script>
</body>

</html>
