      //increment operators
      var a = 10;
      var b;
      document.write("a=", a, "<br>");//a=10
      document.write("b=", b, "<br>");//b=undefined

      //preincrement operator
      b = ++a;
      document.write("a=", a, "<br>");//a=11
      document.write("b=", b, "<br>");//b=11

      //postfix increment operator
      var c;
      c = a++;
      document.write("a=", a, "<br>");//a=12
      document.write("c=", c, "<br>");//c=11

      document.write("b=", b, "<br>");//b=11

      //predecrement operator
      b = --a;
      document.write("a=", a, "<br>");//a=9
      document.write("b=", b, "<br>");//b=9

      //postfix decrement operator
      var c;
      c = a--;
      document.write("a=", a, "<br>");//a=8
      document.write("c=", c);//c=9
