<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function no() {
            document.write(25 + 80, "<br>");//105
        }
        no();

        function data(a, b) {
            return a + b;
        }
        var demo = data(6, 4);
        document.write(demo, "<br>");//10

        function greet() {
            console.log("Hello!");
        }

        greet();
        greet();
        greet();

        function welcome(name) {
            console.log("Welcome " + name);
        }

        welcome("Trupti");
        welcome("Rahul");
        welcome("Priya");

        function add(a, b) {    //parameters → a, b
            console.log(a + b);
        }

        add(10, 20);  //arguments → 10, 20


        //function expression
        let multiply = function (a, b) {
            return a * b;
        };

        console.log(multiply(5, 3));

        //function declaration
        sayHello();

        function sayHello() {
            console.log("Hello");
        }

        //anonymous function
        var greet = function () {
            console.log("Anonymous Function");
        };

        greet();

        //Arrow Functions (=>)
        var add = (a, b) => {
            return a + b;
        };

        console.log(add(5, 3));

        const square = x => {
            return x * x;
        };

        console.log(square(4));

        const multi = (a, b) => a * b;

        console.log(multi(4, 5));

        function greet(name = "Guest") {
            console.log("Hello " + name);
        }

        greet();
        greet("Trupti");

        //callback functions
        function reet(name, callback) {
            console.log("Hello " + name);
            callback();
        }
        function callMe() {
            console.log("Goodbye!");
        }
        reet("Trupti", callMe);


        var button = document.createElement("button");
        button.addEventListener("click", function () {
            console.log("Button clicked");
        });

        //higher-order functions
        function calculate(a, b, operation) {
            return operation(a, b);
        }
        function add(a, b) {
            return a + b;
        }
        function subtract(a, b) {
            return a - b;
        }
        console.log(calculate(10, 5, add)); // Output: 15
        console.log(calculate(10, 5, subtract)); // Output: 5

        //returning functions (closures)
        function outer() {
            return function () {
                console.log("Inner Function");
            };
        }

        const inner = outer();

        inner();


        //immediately invoked function expression (IIFE)
        (function () {
            console.log("Executed immediately");
        })();

        function test() {
            let message = "Hello";
            console.log(message);
        }

        test();
        (function () {
            console.log("message");
        })();

        function calculateTotal(price, quantity) {
            return price * quantity;
        }

        let total = calculateTotal(999, 2);

        console.log("Total:", total);
    </script>
</body>

</html>
