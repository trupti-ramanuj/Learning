<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // for loop

        for (var i = 1; i <= 5; i++) {
            document.write(i, "<br>");
        }

        //while loop

        var i = 1;
        while (i <= 5) {
            document.write(i, "<br>");
            i++;
        }

        //do_while loop

        var i = 1;
        do {
            document.writeln(i, "<br>");
            i++;
        } while (i <= 5);


        //Nested
        for (let i = 1; i <= 3; i++) {

            for (let j = 1; j <= 2; j++) {

                console.log(i, j);

            }

        }
        for (let i = 1; i <= 10; i++) {

            if (i == 5) {

                break;

            }

            console.log(i);

        }
        for (let i = 1; i <= 3; i++) {

            for (let j = 1; j <= 2; j++) {

                console.log(i, j);

            }

        }

        //Pattern
        for (let i = 1; i <= 5; i++) {

            let star = "";

            for (let j = 1; j <= i; j++) {

                star += "*";

            }

            console.log(star);

        }
        let products = ["Laptop", "Phone", "Watch"];

        for (let i = 0; i < products.length; i++) {

            console.log(products[i]);

        }
    </script>
</body>

</html>
